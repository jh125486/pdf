name: Mutation badges

# Mutation-tests this repo's actual parsing/rendering logic -- the root
# `pdf` package -- excluding examples/ and pdfpasswd/: those are
# demonstration/CLI code, not the library surface this fork exists to
# harden (see README.md's malformed/hostile-PDF-input rationale), so a
# mutant there would mostly prove the example works, not that parsing is
# correct.
#
# A full sweep is slow enough that this runs on a schedule/manual dispatch,
# never per-push or per-PR -- same reasoning as turango's own dogfooding
# workflow (github.com/jh125486/turango
# .github/workflows/mutation-badge.yml), which this file is adapted from.
#
# There is only one package here (".", already run with the cheaper
# -mutatescope=package), so unlike a multi-package repo this can't be
# sharded across CI jobs by package path. Instead, a "plan" job enumerates
# every func/method name in the package via `go doc -all -u` and splits
# them round-robin into NUM_SHARDS buckets, each becoming an anchored
# `-mutate=<regexp>` alternation (turango's `-mutate` is a name regexp,
# same convention as `-run`/`-bench`/`-fuzz`, not a package selector). This
# keeps the split self-maintaining: a renamed/added/removed function is
# picked up next run without editing this file, unlike a hardcoded name
# list would be.
on:
  schedule:
    # Weekly. The mutation score changes only when source or tests change,
    # not on a fixed cadence, but a calendar trigger is the simplest way to
    # keep the published badge from silently going stale if nobody happens
    # to run this manually for a while.
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch: {}

env:
  # How many parallel shards to split the function list across. Each shard
  # gets its own runner, so raise this to trade more concurrent runners for
  # a shorter wall-clock time; the plan job's round-robin split adapts
  # automatically, no other change needed.
  NUM_SHARDS: 4

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Enumerate functions/methods and split into shard patterns
        id: plan
        run: |
          # go doc's `func ` lines cover both plain funcs ("func Name(...)")
          # and methods ("func (recv Type) Name(...)"); strip everything
          # but the identifier turango's -mutate regex needs to match.
          mapfile -t names < <(
            go doc -all -u . \
              | grep -E '^func ' \
              | sed -E 's/^func (\([^)]*\) )?([A-Za-z0-9_]+)\(.*/\2/' \
              | sort -u
          )

          n="${NUM_SHARDS}"
          declare -a groups
          for i in "${!names[@]}"; do
            idx=$(( i % n ))
            if [ -z "${groups[$idx]:-}" ]; then
              groups[$idx]="${names[$i]}"
            else
              groups[$idx]="${groups[$idx]}|${names[$i]}"
            fi
          done

          matrix=$(jq -n --argjson n "$n" '{include: []}')
          for (( idx=0; idx<n; idx++ )); do
            pattern="^(${groups[$idx]})\$"
            matrix=$(echo "$matrix" | jq -c --argjson idx "$idx" --arg pattern "$pattern" \
              '.include += [{"shard": $idx, "pattern": $pattern}]')
          done

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutation-shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install turango
        run: go install github.com/jh125486/turango/cmd/turango@latest

      # Verdicts are cached across scheduled runs, keyed on the hash of
      # every source/test file the run below covers plus the shard index,
      # so an unrelated doc-only change still gets a full cache hit next
      # Monday, a real source edit invalidates only the mutants it affects,
      # and shards never share or clobber each other's cache entries.
      - name: Restore mutation verdict cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: mutation-cache
          key: mutation-cache-${{ matrix.shard }}-${{ hashFiles('*.go') }}
          restore-keys: |
            mutation-cache-${{ matrix.shard }}-

      - name: Run turango against this shard's functions
        run: |
          mkdir -p mutation-report mutation-cache
          turango test -mutate="${{ matrix.pattern }}" \
            -mutatescope=package \
            -mutateoutput=mutation-report \
            -mutatecache=mutation-cache \
            .

      - name: Upload shard report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-report-${{ matrix.shard }}
          path: mutation-report/mutate-report.json

  publish-badges:
    needs: mutation-shard
    runs-on: ubuntu-latest
    # contents:write is required to push the generated badge JSON to
    # gh-pages via peaceiris/actions-gh-pages; cannot be downgraded to read.
    permissions:
      contents: write
    steps:
      - name: Download all shard reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutation-report-*
          path: mutation-reports
          merge-multiple: false

      - name: Merge shard reports and compute mutation metrics
        id: score
        run: |
          reports=$(find mutation-reports -name mutate-report.json)
          mutants=$(jq -s '[.[].Mutants[]] | length' $reports)
          killed=$(jq -s '[.[].Mutants[] | select(.Status=="killed")] | length' $reports)
          survived=$(jq -s '[.[].Mutants[] | select(.Status=="survived")] | length' $reports)
          viable=$((killed + survived))

          if [ "$viable" -eq 0 ]; then
            pct="0.0"
          else
            pct=$(awk -v k="$killed" -v v="$viable" 'BEGIN { printf "%.1f", (k / v) * 100 }')
          fi

          # shields.io endpoint-schema color thresholds: red below 50%,
          # yellow from 50% up to (not including) 80%, green at 80%+.
          color=$(awk -v p="$pct" 'BEGIN {
            if (p + 0 >= 80) print "brightgreen";
            else if (p + 0 >= 50) print "yellow";
            else print "red";
          }')

          echo "mutants=$mutants" >> "$GITHUB_OUTPUT"
          echo "killed=$killed" >> "$GITHUB_OUTPUT"
          echo "survived=$survived" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Write shields.io endpoint JSON files
        run: |
          mkdir -p badges
          cat > badges/mutation-score.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutation score",
            "message": "${{ steps.score.outputs.pct }}%",
            "color": "${{ steps.score.outputs.color }}"
          }
          EOF

          cat > badges/mutants-count.json <<EOF
          {
            "schemaVersion": 1,
            "label": "mutants",
            "message": "${{ steps.score.outputs.mutants }}",
            "color": "blue"
          }
          EOF

      - name: Publish to gh-pages
        # peaceiris/actions-gh-pages creates the gh-pages branch on its
        # first run if it doesn't exist yet, and updates it in place after.
        # keep_files: true so this workflow only ever touches its own
        # badges/ directory.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          keep_files: true
          commit_message: >-
            mutation score: ${{ steps.score.outputs.pct }}%
            across ${{ steps.score.outputs.mutants }} mutants
            (${{ steps.score.outputs.killed }} killed /
            ${{ steps.score.outputs.survived }} survived)
