name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # SONAR_TOKEN is exposed at job level, not just the SonarCloud step's own
    # env:, specifically so the SonarCloud Scan step's `if:` guard below can
    # read it as `env.SONAR_TOKEN` -- the `secrets` context is not a valid
    # expression context inside a step/job `if:` at all (referencing
    # secrets.SONAR_TOKEN directly in `if:` fails the whole workflow at
    # parse time, before any job even starts; see turango's ci.yml for the
    # same fix, found there the hard way).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out code
        # Actions below are pinned to full commit SHAs, not tags: a tag can be
        # re-pointed (deliberately, by a re-tag, or maliciously, by a
        # compromised release) to run different code than what was reviewed,
        # while a SHA can't. The trailing `# vN` comment is only for humans.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not just the checked-out commit: golangci-lint's
          # issues.new-from-rev setting (see .golangci.yml) diffs against a
          # fixed baseline commit, which a shallow clone wouldn't have.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check Go fixes
        # go fix is built into the go command (needs 1.26+, which is why
        # go.mod's go directive was bumped there rather than kept lower):
        # reports safe, mechanical modernizations -- any/interface{},
        # range-over-int, io/ioutil -> io, and similar -- the same rewrites
        # `make fix` applies locally. -diff fails the build if any are
        # outstanding rather than silently accepting them.
        run: go fix -diff ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./coverage.out
          # Codecov's current policy is that public open-source repos on
          # codecov.io don't need a token; this is passed anyway (empty
          # until the secret is created) so a private-repo period, or a
          # policy change, doesn't silently stop uploads. fail_ci_if_error
          # keeps a missing/invalid token from failing the whole CI run.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: SonarQube Cloud Scan
        # SonarSource/sonarcloud-github-action is deprecated (its own run
        # output shows it internally delegating to this action) --
        # sonarqube-scan-action is the documented drop-in replacement, same
        # SONAR_TOKEN/GITHUB_TOKEN env vars, no other input changes needed.
        #
        # Guarded on the secret's presence (not just left to fail) so this
        # step is a no-op -- not a broken CI run -- until SONAR_TOKEN exists
        # as a repo secret. SonarCloud's Go analyzer reads coverage.out
        # directly via sonar.go.coverage.reportPaths (see
        # sonar-project.properties), so this must run after the Test step
        # above, not standalone.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # See the Test job's checkout step: golangci-lint's new-from-rev
          # needs the baseline commit reachable, not just the tip.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Lint
        # go tool -modfile, not the golangci-lint-action marketplace action:
        # the tool version lives in tools.mod (bumped via `make
        # update-lint`), so this runs the exact version a contributor gets
        # locally via `make lint` -- no separate action-input pin to keep
        # in sync, and no marketplace action in the trust chain at all.
        run: go tool -modfile=tools.mod golangci-lint run ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Check vulnerabilities
        # This fork's entire reason to exist is hardening against malformed
        # and hostile PDF input (see GO-2026-6115 / CVE-2026-56867 in
        # README.md); a known vulnerability in a dependency landing here
        # unnoticed would undercut that, so this blocks merge rather than
        # just reporting.
        run: go tool -modfile=tools.mod govulncheck ./...
