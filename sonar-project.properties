# SonarCloud configuration for jh125486/pdf.
sonar.projectKey=jh125486_pdf
sonar.organization=jh125486

# Go coverage: matches ci.yml's "Test" step, which writes coverage.out via
# `go test -coverprofile=coverage.out ./...`. SonarCloud's Go analyzer reads
# the standard `go test` cover-profile format directly, no conversion step
# needed.
sonar.go.coverage.reportPaths=coverage.out

# Without this, SonarCloud counts every *_test.go file itself as source
# needing coverage. That's not a real gap: `go test`'s own coverage profile
# only ever instruments non-test source (a test file is the thing doing the
# covering, not a thing that gets covered), so those files were never going
# to appear in coverage.out with anything but 0% — counting them anyway
# drags the whole-project percentage down by a non-representative margin.
#
# examples/ and pdfpasswd/ are also excluded from coverage: illustrative/CLI
# wrapper code, not part of this library's public API surface -- already
# excluded from .golangci.yml's linters and formatters for the same reason,
# and from this fork's 90%-coverage target (issue #2), which is scoped to
# the library package itself.
sonar.coverage.exclusions=**/*_test.go,examples/**,pdfpasswd/**

# Same two directories excluded from analysis entirely, not just coverage.
sonar.exclusions=examples/**,pdfpasswd/**
